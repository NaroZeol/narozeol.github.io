future: true
locale: "zh-CN"
date_format: "%Y-%m-%d"
minimal_mistakes_skin: "default"
title: NaroZeol的博客
description: "NaroZeol 的个人博客，记录系统与编程的学习笔记、实践过程和日常想法。"
name: "NaroZeol"
repository: "NaroZeol/narozeol.github.io"
timezone: "Asia/Shanghai"
copyright: "NaroZeol"
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.27.3"
url: "https://narozeol.github.io"
baseurl: ""
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Theme-native list pagination; the full archive stays available at /posts/.
paginate: 8
paginate_path: /page:num/

# Disable both the theme's subscription links and feed discovery metadata.
atom_feed:
  hide: true

thoughts_gist_url: "https://gist.githubusercontent.com/NaroZeol/a783c548bd3c7b22578a4bd3748bc9d5/raw/thoughts.json"
exclude:
  - tools
  - tests
  - README.md
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules

include:
  - _pages

author:
  name   : "NaroZeol"
  home   : "/about/"
  avatar : "/assets/images/bio-photo.jpg"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/NaroZeol"

footer:
  since: "2024"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      show_date: true
      comments: false
      share: false
      related: true
      toc: true
      toc_label: "目录"
      toc_icon: "list-ul"
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

enable_copy_code_button: true

# SEO
google_site_verification: ROW3yrTZIsYdNu5nbnbkHnphAttpGYEbffKwbBOgMNU
bing_site_verification: "E929E566B19B6994BF63D84A3A2FFF97"
