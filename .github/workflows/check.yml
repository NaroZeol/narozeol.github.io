name: Blog, Thoughts API & Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec jekyll build --trace
      - uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: _site/
          retention-days: 14
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: thoughts-app/requirements.txt
      - run: pip install -r thoughts-app/requirements.txt pytest==8.4.2
      - run: python -m pytest thoughts-app/tests -q
      - run: node --check thoughts-app/static/app.js && node --check assets/js/thoughts.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.THOUGHTS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THOUGHTS_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          umask 077
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thoughts.jks"
            printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/signing-password"
            echo 'APK_KIND=release' >> "$GITHUB_ENV"
          else
            printf '%s' 'android-ci-only' > "$RUNNER_TEMP/signing-password"
            keytool -genkeypair -keystore "$RUNNER_TEMP/thoughts.jks" -storepass:file "$RUNNER_TEMP/signing-password" -alias thoughts -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Thoughts CI Preview'
            echo 'APK_KIND=preview' >> "$GITHUB_ENV"
            echo 'THOUGHTS_PREVIEW=1' >> "$GITHUB_ENV"
          fi
      - name: Build native APK
        env:
          THOUGHTS_KEYSTORE: ${{ runner.temp }}/thoughts.jks
          THOUGHTS_KEYSTORE_PASSWORD_FILE: ${{ runner.temp }}/signing-password
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: thoughts-android-${{ env.APK_KIND }}
          path: android/build/thoughts.apk
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          THOUGHTS_KEYSTORE: ${{ runner.temp }}/thoughts.jks
          THOUGHTS_KEYSTORE_PASSWORD_FILE: ${{ runner.temp }}/signing-password
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" bash android/test.sh
